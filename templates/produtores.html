<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Produtores - AgroCalc</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Produtores Cadastrados</h2>
        <div>
            <a href="/" class="btn btn-outline-secondary">Voltar</a>
            <a href="/produtores/novo" class="btn btn-success">Novo Produtor</a>
        </div>
    </div>
    
    <table class="table table-striped border align-middle">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Telefone</th>
                <th style="width: 180px;">Ações</th>
            </tr>
        </thead>
        <tbody>
            {% for produtor in produtores %}
            <tr>
                <td>{{ produtor.id }}</td>
                <td>{{ produtor.nome }}</td>
                <td>{{ produtor.telefone }}</td>
                <td>
                    <!-- Botão Editar -->
                    <a href="/produtores/editar/{{ produtor.id }}" class="btn btn-primary btn-sm me-1">Editar</a>
                    
                    <!-- Botão Excluir -->
                    <form action="/produtores/excluir/{{ produtor.id }}" method="POST" style="display:inline;">
                        <button class="btn btn-danger btn-sm" onclick="return confirm('Deseja excluir?')">Excluir</button>
                    </form>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="4" class="text-center">Nenhum produtor cadastrado.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
