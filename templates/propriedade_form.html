<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% if propriedade %}Editar Propriedade{% else %}Cadastrar Propriedade{% endif %} - AgroCalc</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
    <h2>{% if propriedade %}Editar Propriedade{% else %}Nova Propriedade{% endif %}</h2>
    
    <form method="POST" 
          action="{{ url_for('editar_propriedade', id=propriedade.id) if propriedade else url_for('nova_propriedade') }}" 
          class="card p-4 shadow-sm">
        
        <div class="mb-3">
            <label class="form-label">Produtor Responsável</label>
            <select name="produtor_id" class="form-select" required>
                <option value="">Selecione...</option>
                {% for prod in produtores %}
                <option value="{{ prod.id }}" {% if propriedade and propriedade.produtor_id == prod.id %}selected{% endif %}>
                    {{ prod.nome }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Nome da Propriedade</label>
            <input type="text" name="nome_propriedade" class="form-control" 
                   value="{{ propriedade.nome_propriedade if propriedade else '' }}" required>
        </div>

        <div class="row">
            <div class="col-md-8 mb-3">
                <label class="form-label">Município</label>
                <input type="text" name="municipio" class="form-control" 
                       value="{{ propriedade.municipio if propriedade else '' }}">
            </div>

            <div class="col-md-4 mb-3">
                <label class="form-label">Estado (UF)</label>
                <input type="text" name="estado" class="form-control" maxlength="2" 
                       value="{{ propriedade.estado if propriedade else '' }}">
            </div>
        </div>

        <div>
            <a href="/propriedades" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-success">Salvar</button>
        </div>
    </form>
</body>
</html>
